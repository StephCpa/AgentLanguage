<script>
const descriptions={architecture:'双前端汇入同一 IR；宿主复核后，由共享解释器、Broker 与 Store 执行。',dataflow:'从原始模型响应、共同解析与隔离构造，到真实 Git 外部状态核对。',sequence:'所示轨迹：发布已发生而回包丢失，随后单独授权查询；纵向间距不表示耗时。',tree:'职责分解：连线表示归属，不是调用。ContextView 与独立任务集冻结仍未完成。',lifecycle:'控制流结束与外部责任分别记录；仅责任全部解决后才成为无未决的结束状态。'};
const buttons=[...document.querySelectorAll('[data-view]')];
function select(view){if(!Object.hasOwn(descriptions,view))view='architecture';for(const b of buttons)b.setAttribute('aria-selected',String(b.dataset.view===view));document.getElementById('reader').src=view+'.html';document.getElementById('reader').title=buttons.find(b=>b.dataset.view===view).textContent+'交互图';document.getElementById('standalone').href=view+'.html';document.getElementById('description').textContent=descriptions[view];history.replaceState(null,'','#'+view)}
for(const b of buttons){b.onclick=()=>select(b.dataset.view);b.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const i=buttons.indexOf(b);const n=e.key==='Home'?0:e.key==='End'?buttons.length-1:(i+(e.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length;buttons[n].focus();select(buttons[n].dataset.view)}}
if(location.hash)select(location.hash.slice(1));
</script>
